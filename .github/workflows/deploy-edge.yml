name: Deploy Edge Functions

on:
  push:
    branches:
      - main
      - 'phase-*'
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy notify-status
        run: supabase functions deploy notify-status --project-ref vrvwdagjpttvfvjanbwq --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
