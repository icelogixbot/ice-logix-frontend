    window.addEventListener('offline', function() {

      if (b) {

        b.innerHTML = '⚡ Нет связи с сетью. Переподключение...';
        b.style.transform = 'translateX(-50%) translateY(0)';
        b.style.opacity = '1';
      }
    });
    window.addEventListener('online', function() {
      var b = document.getElementById('netStatusBanner');
      if (b) {
        b.style.background = 'rgba(16, 185, 129, 0.95)';
        b.innerHTML = '✅ Соединение восстановлено';
        setTimeout(function() {
          b.style.transform = 'translateX(-50%) translateY(-60px)';
