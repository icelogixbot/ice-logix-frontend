<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="jdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea251b"/>
      <stop offset="100%" stop-color="#b60d14"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="128" height="128" rx="28" fill="url(#jdBg)"/>

  <!-- Joy the JD Dog Mascot -->
  <g fill="#ffffff">
    <!-- Dog head outline -->
    <path d="M64 24 C45 24 33 37 33 54 C33 65 39 74 48 78 L48 83 C48 86 52 88 56 87 L62 85 C63.3 85.3 64.7 85.3 66 85 L72 87 C76 88 80 86 80 83 L80 78 C89 74 95 65 95 54 C95 37 83 24 64 24 Z"/>
  </g>

  <!-- Dog ears and face details in JD red -->
  <g fill="#ea251b">
    <!-- Left ear drop -->
    <path d="M33 46 C31 52 32 60 37 64 C35 58 35 51 37 46 Z"/>
    <!-- Right ear drop -->
    <path d="M95 46 C97 52 96 60 91 64 C93 58 93 51 91 46 Z"/>

    <!-- Left eye -->
    <circle cx="51" cy="51" r="5"/>
    <circle cx="52.5" cy="49.5" r="1.5" fill="#ffffff"/>

    <!-- Right eye -->
    <circle cx="77" cy="51" r="5"/>
    <circle cx="78.5" cy="49.5" r="1.5" fill="#ffffff"/>

    <!-- Cute nose -->
    <ellipse cx="64" cy="61" rx="6" ry="4"/>

    <!-- Smile line -->
    <path d="M58 66 Q64 73 70 66" fill="none" stroke="#ea251b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Clean JD typography at bottom -->
  <text x="64" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">JD.COM</text>
</svg>
