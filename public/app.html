    function getProductImages(imageUrl) {
      if (!imageUrl) return [];
      let urls = [];
      const trimmed = String(imageUrl).trim();
      if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
        try {
          urls = JSON.parse(trimmed);
        } catch (e) {
          urls = [imageUrl];
        }
      } else if (trimmed.includes(',')) {
        urls = trimmed.split(',').map(u => u.trim());
      } else {
        urls = [imageUrl];
      }
      return (Array.isArray(urls) ? urls : [urls]).map(u => String(u).trim()).filter(Boolean);
    }

    function getResaleImages(item) {
      if (item.image_url) return getProductImages(item.image_url);
      if (item.images) return getProductImages(item.images);
      
      const orderItems = item.orders?.items || item.orders?.cart_items;
      if (Array.isArray(orderItems) && orderItems.length > 0) {
        const img = orderItems[0].imageUrl || orderItems[0].image_url || orderItems[0].image;
        if (img) return getProductImages(img);
      }
      
      if (item.orders && Array.isArray(item.orders.photo_reports) && item.orders.photo_reports.length > 0) {
        return item.orders.photo_reports;
      }
      
      return ['https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=80'];
    }

    window.showImagePreview = (urls, startIndex = 0) => {
      if (typeof urls === 'string') urls = [urls];
      if (!urls || urls.length === 0) return;

      const modal = document.createElement('div');
      modal.className = 'image-preview-modal';
      
      modal.innerHTML = `
        <div class="image-preview-backdrop"></div>
        <button class="image-preview-close">&times;</button>
        <div class="image-preview-slider">
          ${urls.map((url, idx) => `

        ${urls.length > 1 ? `

              <div class="image-preview-dot ${idx === startIndex ? 'active' : ''}"></div>
            `).join('')}
          </div>
        ` : ''}
      `;

      document.body.appendChild(modal);

      const slider = modal.querySelector('.image-preview-slider');
      
      setTimeout(() => {
        if (slider && startIndex > 0) {
          slider.scrollLeft = startIndex * slider.clientWidth;
        }

      if (urls.length > 1) {
        slider.addEventListener('scroll', () => {
          const index = Math.round(slider.scrollLeft / slider.clientWidth);

          dots.forEach((dot, idx) => {

      const closeBtn = modal.querySelector('.image-preview-close');
      const backdrop = modal.querySelector('.image-preview-backdrop');
      
      const closeModal = () => {
        modal.classList.add('closing');
        setTimeout(() => {

      };

      closeBtn.onclick = closeModal;

    // --- APP CACHE FOR BLAZING FAST NAVIGATION (Stale-While-Revalidate + LocalStorage) ---
    window.CacheDB = {
      data: (() => {
        try {
          const s = localStorage.getItem('ice_cache_db');
          return s ? JSON.parse(s) : {};
        } catch(e) { return {}; }
      })(),
      save() {
        try {
          localStorage.setItem('ice_cache_db', JSON.stringify(this.data));
        } catch(e) {}
      },
      async get(key, fetcher, ttl = 600000) { // 10 mins cache
        const now = Date.now();
        const cached = this.data[key];
        if (cached && (now - cached.timestamp < ttl)) {
          return cached.value;
        }
        // Instant Return: if we have cached data, return it immediately and revalidate in background
        if (cached && cached.value) {
          fetcher().then(fresh => {
            if (fresh) {
              this.data[key] = { value: fresh, timestamp: Date.now() };
              this.save();
            }
          }).catch(() => {});
          return cached.value;
        }
        try {
          const val = await fetcher();
          if (val) {
            this.data[key] = { value: val, timestamp: now };
            this.save();
          }
          return val;
        } catch(e) {
          return cached?.value || null;
        }
      },
      clear(key) { delete this.data[key]; this.save(); },
      clearAll() { this.data = {}; this.save(); }
    };

    function trackBlobUrl(key, file) {

      if (old) URL.revokeObjectURL(old);
      const url = URL.createObjectURL(file);
      _photoBlobUrls.set(key, url);
      return url;
    }
    function clearBlobUrls(prefix) {

    // ═════════════════════════════════════════════════════════════════════════
    // ICE LOGIX ICON SYSTEM — inline SVG icons rendered via ix(name, opts)
    // 24×24 viewBox, currentColor stroke, 2px stroke, round caps. Glass-style.
    // ═════════════════════════════════════════════════════════════════════════
    // ICON_PATHS is loaded from /js/icons-data.js
    const ICON_PATHS = window.ICON_PATHS || {};

    /**
     * Render an inline SVG icon.
     * @param {string} name - icon name from ICON_PATHS.
     * @param {object} opts - { size, cls, stroke, fill, viewBox, style }.
     * @returns {string} HTML string.
     */
    function ix(name, opts = {}) {
      const p = ICON_PATHS[name];
      if (!p) return '';
      const cls = ['ix', opts.cls || ''].filter(Boolean).join(' ');
      const sz  = opts.size || '';
      const sw  = opts.stroke ?? 2;
      const vb  = opts.viewBox || '0 0 24 24';
      const fill= opts.fill || 'none';
      const stl = opts.style ? ` style="${opts.style}"` : '';
      const szAttr = sz ? ` style="width:${sz};height:${sz}"` : '';
      return `<span class="${cls}"${szAttr}${stl}><svg viewBox="${vb}" fill="${fill}" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg></span>`;
    }

    /**
     * Render the brand snowflake as a styled SVG (replaces the ❄️ emoji
     * for non-balance places that still want a stylized snowflake).
     */
    function brandFlake(opts = {}) {
      const sz = opts.size || '1.35em';
      const cls = ['brand-flake', opts.cls || ''].filter(Boolean).join(' ');
      return `<span class="${cls}" style="width:${sz};height:${sz}" aria-hidden="true"><img src="./assets/icl_currency_icon.png" alt="ICL" style="width:100%;height:100%;object-fit:contain;"></span>`;
    }

    /** Render a marketplace colored dot — replaces 🟢🟠🟡🟤⚫🔵 emoji. */
    function mpDot(color) {
      const safe = String(color || '#9CA3AF').replace(/[^#a-zA-Z0-9(),.\s]/g, '');
      return `<span class="mp-dot" style="background:${safe}" aria-hidden="true"></span>`;
    }

    /** Render a 1-5 star rating row using star icons. */
    function starRow(rating, max = 5) {
      const r = Math.max(0, Math.min(max, Number(rating) || 0));
      let html = '<span class="star-row">';
      for (let i = 1; i <= max; i++) {
        if (i <= Math.floor(r)) html += ix('star', { cls: 'ix-fill' });
        else if (i - r < 1) html += ix('starHalf', { cls: 'ix-fill' });
        else html += `<span class="ix" style="color: rgba(255,255,255,0.25)">${ix('star').replace('<span class="ix">','').replace('</span>','')}</span>`;
      }
      return html + '</span>';
    }

    // ═════════════════════════════════════════════════════════════════════════
    // GLASS MODAL — in-app alert / confirm / popup that replaces native dialogs
    // ═════════════════════════════════════════════════════════════════════════
    let _glassModalRoot = null;
    function _ensureGlassModalRoot() {
      if (_glassModalRoot && document.body.contains(_glassModalRoot)) return _glassModalRoot;
      _glassModalRoot = document.createElement('div');
      _glassModalRoot.id = 'glassModalRoot';
      document.body.appendChild(_glassModalRoot);
      return _glassModalRoot;
    }

    /**
     * Show a glass-style modal (alert / confirm / custom buttons).
     * @param {object} opts - { title, message, kind, buttons }
     *   - title: header text (string)
     *   - message: body text (string)
     *   - kind: 'info' | 'success' | 'warning' | 'error' | 'confirm'
     *   - buttons: array of { id, label, variant: 'primary'|'danger'|'ghost'|'' }
     * @returns {Promise<string>} resolves to clicked button id (or 'ok'/'cancel').
     */
    function glassModal(opts = {}) {
      const root = _ensureGlassModalRoot();
      const kind = opts.kind || 'info';
      const iconName = ({ success: 'check', warning: 'warn', error: 'error', info: 'info', confirm: 'info' })[kind] || 'info';
      const title = opts.title || ({ success: 'Готово', warning: 'Внимание', error: 'Ошибка', info: 'Сообщение', confirm: 'Подтверждение' })[kind];
      const message = opts.message || '';
      const buttons = opts.buttons && opts.buttons.length ? opts.buttons : [{ id: 'ok', label: 'Понятно', variant: 'primary' }];

      const overlay = document.createElement('div');
      overlay.className = 'glass-modal-overlay';
      overlay.innerHTML = `
        <div class="glass-modal" role="dialog" aria-modal="true">
          <div class="glass-modal-header">
            <div class="glass-modal-icon ${kind}">${ix(iconName, { size: '24px' })}</div>
            <div class="glass-modal-title"></div>
          </div>
          <div class="glass-modal-body"></div>
          <div class="glass-modal-footer"></div>
        </div>
      `;
      overlay.querySelector('.glass-modal-title').textContent = title;
      overlay.querySelector('.glass-modal-body').textContent = message;
      const footer = overlay.querySelector('.glass-modal-footer');
      buttons.forEach((b) => {
        const btn = document.createElement('button');
        btn.className = 'glass-modal-btn ' + (b.variant || '');
        btn.textContent = b.label;
        btn.dataset.id = b.id;
        footer.appendChild(btn);
      });
      root.innerHTML = '';
      root.appendChild(overlay);
      // Trigger CSS transition
      requestAnimationFrame(() => overlay.classList.add('show'));

      return new Promise((resolve) => {
        const close = (id) => {
          overlay.classList.remove('show');
          setTimeout(() => { try { overlay.remove(); } catch {} resolve(id); }, 260);
        };
        footer.querySelectorAll('.glass-modal-btn').forEach((btn) => {
          btn.addEventListener('click', () => close(btn.dataset.id));
        });
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) close('cancel');
        });
      });
    }

    /** Show a non-blocking glass toast (auto-dismisses). */
    function glassToast(message, opts = {}) {
      const kind = opts.kind || 'info';
      const iconName = ({ success: 'check', warning: 'warn', error: 'error', info: 'info' })[kind] || 'info';
      const duration = opts.duration ?? 2600;
      const node = document.createElement('div');
      node.className = `glass-toast toast-${kind}`;
      node.innerHTML = `${ix(iconName, { size: '20px' })}<span></span>`;
      node.querySelector('span').textContent = String(message ?? '');
      document.body.appendChild(node);
      requestAnimationFrame(() => node.classList.add('show'));
      setTimeout(() => {
        node.classList.remove('show');
        setTimeout(() => { try { node.remove(); } catch {} }, 300);
      }, duration);
    }

    /** Heuristic to pick a glass-modal kind from message text. */
    function _guessKind(msg) {
      const s = String(msg || '');
      if (/^❌|ошибк|не уда|не удалось|сбой|fail/i.test(s)) return 'error';
      if (/^⚠|внимание|warn/i.test(s)) return 'warning';
      if (/^(✅|🎉)|готово|успешн|успех|создан|сохранён/i.test(s)) return 'success';
      return 'info';
    }
    /** Strip leading emoji prefix from a message (we render icon separately). */
    function _stripLeadEmoji(msg) {
      return String(msg || '').replace(/^[\s]*[❌⚠️✅🎉ℹ️📦🔍]+\s*/u, '').trim();
    }

    // ═════════════════════════════════════════════════════════════════════════
    // GLASS SELECT — enhances native <select> elements with a sheet picker
    // ═════════════════════════════════════════════════════════════════════════
    function _gxRenderTrigger(sel, wrap) {
      const placeholder = sel.dataset.gxPlaceholder || 'Выбрать…';
      const opt = sel.options[sel.selectedIndex];
      const value = opt && opt.value !== '' ? opt.text : '';
      const iconName = opt && opt.dataset?.icon;
      const isPlaceholder = !value;
      const trig = wrap.querySelector('.gx-select-trigger');
      const valueSpan = trig.querySelector('.gx-select-trigger-value');
      if (isPlaceholder) {
        valueSpan.textContent = placeholder;
      } else if (iconName) {
        valueSpan.innerHTML = `${ix(iconName, { size: '18px' })}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))}</span>`;
      } else {
        valueSpan.textContent = value;
      }
      trig.classList.toggle('placeholder', isPlaceholder);
    }

    function _gxOpenSheet(sel, wrap) {
      const title = sel.dataset.gxTitle || sel.previousElementSibling?.textContent?.trim() || 'Выбрать';
      const overlay = document.createElement('div');

    function enhanceCategoryTwoStep(selectId) {

    function validateOrderBeforeSubmit(order) {
      const errors = [];
      if (!order) { errors.push('Нет данных заказа'); return errors; }

      // 1. Цена
      const price = parseFloat(order.price);
      if (!isFinite(price) || price <= 0) {
        errors.push('Укажите цену товара (число > 0)');
      } else {
        const range = PRICE_RANGES[order.currency];
        if (range && (price < range[0] || price > range[1])) {
          errors.push(`Цена ${price} ${order.currency} вне разумного диапазона (${range[0]}–${range[1]}). Уверены что цена в ${order.currency}?`);
        }
      }

      // 2. Валюта
      if (!order.currency) errors.push('Выберите валюту');

      // 3. Вес
      const weight = parseFloat(order.weight);
      if (!isFinite(weight) || weight <= 0) {
        errors.push('Укажите вес (> 0 кг)');
      } else if (weight < 0.05) {
        errors.push('Вес слишком маленький (минимум 0.05 кг)');
      } else if (weight > 30) {
        errors.push('Вес слишком большой (максимум 30 кг — мы не возим грузовые)');
      }

      // 4. Категория
      if (!order.category) errors.push('Выберите наименование товара');

      if (!order.country) errors.push('Выберите страну площадки');

      const url = (order.url || '').trim();
      if (url) {
        try {
          const u = new URL(url);
          if (u.protocol !== 'http:' && u.protocol !== 'https:') {
            errors.push('Ссылка должна начинаться с http:// или https://');
          } else {
            // Проверка домена (warning, не ошибка — мы не хотим блокировать неизвестные площадки)
            const host = u.hostname.toLowerCase().replace(/^www\./, '');
            const isKnown = ALLOWED_MARKETPLACE_HOSTS.some(h => host === h || host.endsWith('.' + h));
            if (!isKnown && !window.confirm(`Площадка ${host} не из нашего списка. Продолжить?`)) {
              errors.push('Подтверждение площадки отменено');

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(rotation);
        
        const N = FORTUNE_REWARDS.length;
        const segmentAngle = (2 * Math.PI) / N;
        
        for (let i = 0; i < N; i++) {
          const r = FORTUNE_REWARDS[i];
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius - 10, i * segmentAngle, (i + 1) * segmentAngle);
          ctx.closePath();
          
          const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, radius);
          grad.addColorStop(0, '#0F172A');
          grad.addColorStop(1, r.color);
          ctx.fillStyle = grad;
          ctx.fill();
          
          ctx.strokeStyle = 'rgba(255,255,255,0.2)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          
          ctx.save();
          ctx.rotate(i * segmentAngle + segmentAngle / 2);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 11px Nunito';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.6)';
          ctx.shadowBlur = 4;
          ctx.fillText(r.text, radius - 25, 0);

        }
        
        ctx.restore();
        
        ctx.beginPath();
        ctx.arc(radius, radius, 22, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(radius, radius, 8, 0, 2 * Math.PI);

        ctx.beginPath();
        ctx.moveTo(radius - 10, 10);

        ctx.fill();
        ctx.strokeStyle = '#0F172A';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      };

      let currentRotation = 0;

              if (!courses || courses.length === 0) return { courses: [], lessons: [] };
              const courseIds = courses.map(c => c.id);
              const { data: lessons } = await supabaseClient.from('lessons').select('*').in('course_id', courseIds).order('order_index', { ascending: true });
              return { courses, lessons: lessons || [] };
            }, 600000).catch(() => {});
            // 6. Pre-warm reviews config
            if (typeof loadReviewsConfig === 'function') loadReviewsConfig().catch(() => {});
            // 7. Notifications & Legit-checks
            if (userId) {
              supabaseClient.from('user_notifications').select('*').eq('user_id', userId).order('created_at', { ascending: false }).limit(50)
                .then(({ data }) => {
                  if (data) {
                    try { localStorage.setItem('ice_cached_notifs_' + userId, JSON.stringify(data)); } catch(e) {}
                    const unread = data.filter(n => !n.is_read);
                    const badge = document.getElementById('notifBadge');
                    if (badge && unread.length > 0) {
                      badge.textContent = unread.length > 99 ? '99+' : unread.length;
                      badge.classList.remove('hidden');
                    }
                  }
                }).catch(() => {});
              window.CacheDB.get('legit_checks_' + userId, async () => {
                const { data } = await supabaseClient.from('legit_check_requests').select('*').eq('user_id', userId).order('created_at', { ascending: false });
                return data || [];
              }, 60000).catch(() => {});
            }

            // 8. Pre-render quick lineup screens into memory cache so 1st click is 0ms
            setTimeout(() => {
              try {
                if (!_tabCache['reports:']) renderReports().then(h => { if (h) _tabCache['reports:'] = { html: h, ts: Date.now() }; }).catch(() => {});
                if (!_tabCache['reviews:']) renderReviews().then(h => { if (h) _tabCache['reviews:'] = { html: h, ts: Date.now() }; }).catch(() => {});
                if (!_tabCache['promo:']) renderPromoPage().then(h => { if (h) _tabCache['promo:'] = { html: h, ts: Date.now() }; }).catch(() => {});
                if (!_tabCache['academy:']) renderAcademy().then(h => { if (h) _tabCache['academy:'] = { html: h, ts: Date.now() }; }).catch(() => {});
                if (userId && !_tabCache['legitcheck:']) renderLegitCheck().then(h => { if (h) _tabCache['legitcheck:'] = { html: h, ts: Date.now() }; }).catch(() => {});
              } catch(e) {}
            }, 400);
          }
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(_prewarm, { timeout: 2000 });
        } else {
          setTimeout(_prewarm, 1500);
        }
      } catch (globalInitErr) {
        console.error('CRITICAL ERROR during init():', globalInitErr);
      } finally {
        // Safe boot without double-rendering or flickering navigation bars
        try {
          if (!window._homeRenderedOnce) {
            switchTab('home');
            window._homeRenderedOnce = true;
          } else {
            attachHomeHandlers();
            if (!_tabCache['home:']) {
              const _c = document.getElementById('content');
              if (_c && _c.innerHTML) _tabCache['home:'] = { html: _c.innerHTML, ts: Date.now() };
            }
          }
          window._appReady = true;
        } catch (tabErr) {
          console.error('Failed to switch tab to home:', tabErr);
        }

        // Deep-link: ?startapp=review_<order_id> → авто-открытие формы отзыва
        try {
          const sp = tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('tgWebAppStartParam') || '';
          if (sp && sp.indexOf('review_') === 0) {
            const orderId = sp.slice('review_'.length);
            setTimeout(() => { try { openReviewForm(orderId); } catch (e) { console.error('openReviewForm failed:', e); } }, 600);
          }
        } catch (dlErr) { console.error('deep-link handling failed:', dlErr); }
      }

      // Watch for category selects to apply 2-step UI enhancement
      try {
        const enhanceAllCategorySelects = () => {
          ['calcCategory', 'orderCategory', 'productCategory'].forEach(enhanceCategoryTwoStep);
        };
        enhanceAllCategorySelects();
        const moEnhance = new MutationObserver(enhanceAllCategorySelects);
        moEnhance.observe(document.body, { childList: true, subtree: true });
      } catch (observerErr) {
        console.error('Failed to initialize category select observer:', observerErr);
      }
    }

        if (userNameHeader && userNameHeader.innerText !== userName) {

        const _hb = document.getElementById('headerBalance');

        setTimeout(() => updateHeaderFamilyBalance().catch(() => {}), 0);

              auth_id: session.user.id,

      // Fetch global vacation & exchange buffer settings from the owner's row
      try {
        const { data: ownerRow } = await supabaseClient.from('users').select('settings').eq('role', 'owner').limit(1).maybeSingle();
        if (ownerRow && ownerRow.settings) {

          }

      }

    async function getScreenshotUrl(path) {
      const { data, error } = await supabaseClient.storage
        .from('product-screenshots')
        .createSignedUrl(path, 600);
      if (error || !data?.signedUrl) return null;
      return data.signedUrl;

    async function uploadProductImage(file) {
      if (!supabaseClient) throw new Error('Клиент Supabase не инициализирован');
      let sessionId = localStorage.getItem('icelogix_session_id');
      if (!sessionId) { sessionId = crypto.randomUUID(); localStorage.setItem('icelogix_session_id', sessionId); }
      const fileExt = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const fileName = `${sessionId}/products/${Date.now()}-${Math.random().toString(36).substring(2, 9)}.${fileExt}`;
      const { error: uploadError } = await supabaseClient.storage
        .from('ugc')
        .upload(fileName, file, { contentType: file.type, upsert: false });
      if (uploadError) throw new Error('Ошибка при загрузке изображения: ' + uploadError.message);
      const { data } = supabaseClient.storage.from('ugc').getPublicUrl(fileName);
      return data.publicUrl;
    }

    async function processScreenshot(taskId, file) {
      let sessionId = localStorage.getItem('icelogix_session_id');
      if (!sessionId) {
        sessionId = crypto.randomUUID();
        localStorage.setItem('icelogix_session_id', sessionId);
      }
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 50);
      const path = `${sessionId}/${Date.now()}_${safeName}`;
      const { error: uploadErr } = await supabaseClient.storage
        .from('product-screenshots')
        .upload(path, file, { contentType: file.type, upsert: false });
      if (uploadErr) throw new Error(`Не удалось загрузить файл: ${uploadErr.message}`);
      const { data, error } = await supabaseClient.functions.invoke('parse-screenshot', {
        body: { jobId: taskId, screenshotPath: path },
      });
      if (error) throw new Error(`Ошибка распознавания: ${error.message}`);
      return data;
    }

    function applyScreenshotResult(data, context) {
      const currencySymbols = { GBP: '£', USD: '$', EUR: '€', CNY: '¥', RUB: '₽', BYN: 'Br' };
      if (context === 'calc') {
        if (data.price != null && Number(data.price) > 0) {
          const el = document.getElementById('calcPrice');
          if (el) el.value = data.price;
        }
        if (data.currency) {
          const sel = document.getElementById('calcCurrency');
          if (sel) { const opt = Array.from(sel.options).find(o => o.value === data.currency); if (opt) sel.value = data.currency; }
          const lbl = document.getElementById('calcPriceCurrency');
          if (lbl) lbl.innerText = currencySymbols[data.currency] || data.currency;
        }
        const titleInp = document.getElementById('calcTitle');
        if (titleInp && data.title && !titleInp.value) titleInp.value = data.title;
      } else {
        if (data.price != null && Number(data.price) > 0) {
          const el = document.getElementById('orderPrice');
          if (el) el.value = data.price;
        }
        if (data.currency) {
          const sel = document.getElementById('orderCurrency');
          if (sel) { const opt = Array.from(sel.options).find(o => o.value === data.currency); if (opt) sel.value = data.currency; }
          const lbl = document.getElementById('orderPriceCurrency');
          if (lbl) lbl.innerText = currencySymbols[data.currency] || data.currency;
        }
        const titleInp = document.getElementById('orderTitle');
        if (titleInp && data.title && !titleInp.value) titleInp.value = data.title;
        if (typeof update === 'function') update();
      }
    }

    function switchTab(tabName, subScreen = null) {
      if (typeof scrollToPageTop === 'function') scrollToPageTop();
      tgUtil.hideMainButton();
      if (tabName !== 'neworder') {
        window.tempOrder = null;
      }

      // If user is already on this exact tab and subscreen, do not reload
      if (currentTab === tabName && currentSubScreen === subScreen) {
        scrollToPageTop();
        return;
      }

      if (currentTab && currentTab !== tabName) previousTab = currentTab;
      currentTab = tabName;
      currentSubScreen = subScreen;
      if (tabName !== 'calculator') clearBlobUrls('calc:');
      if (tabName !== 'neworder') clearBlobUrls('order:');
      if (tabName !== 'legitcheck') {
        clearBlobUrls('legit:');
        window.legitPhotos = [];
        window.legitResult = null;
      }
      const currentActive = document.querySelector('.tab-item.active');
      const targetActive = document.querySelector(`.tab-item[data-tab="${tabName}"]`);
      if (currentActive !== targetActive) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        if (targetActive) targetActive.classList.add('active');
      }
      tgUtil.haptic('selection');
      
      // Restore from HTML cache for instant screen switch (0ms delay, no flicker)
      const _ck = (tabName || '') + ':' + (subScreen || '');
      if (_tabCache[_ck] && Date.now() - _tabCache[_ck].ts < 600000) {
        const _cd = document.getElementById('content');
        if (_cd) {
          _cd.innerHTML = _tabCache[_ck].html;
          scrollToPageTop();
          _silentRefreshHandlers(tabName);
          return;
        }
      }
      scrollToPageTop();
      renderCurrentScreen();
    }

    function syncTelegramBackButton() {
      const isRoot = currentTab === 'home' && !currentSubScreen;
      if (isRoot) {
        tgUtil.setBackButton(null);
        return;
      }
      
      if (currentTab === 'new-order') {
        tgUtil.setBackButton(() => {
          tgUtil.haptic('light');
          if (window.orderAddMode) {
            if (window.orderAddSubMode) {
              window.orderAddSubMode = null;
              window.orderLinkAnalyzed = false;
              renderCurrentScreen();
              syncTelegramBackButton();
            } else {
              window.orderAddMode = false;
              renderCurrentScreen();
              syncTelegramBackButton();
            }
            return;
          }
          if (previousTab && previousTab !== currentTab) {
            switchTab(previousTab);
          } else {
            switchTab('home');
          }
        });
        return;
      }

      tgUtil.setBackButton(() => {
        tgUtil.haptic('light');
        if (currentSubScreen) {
          currentSubScreen = null;
          renderCurrentScreen();
          syncTelegramBackButton();
          return;
        }

          switchTab(previousTab);
        } else {
          switchTab('home');
        }
      });
    }

    function initBannerAutoScroll() {
      const container = document.getElementById('promoBannersContainer');
      const dotsContainer = document.getElementById('bannerDots');
      if (!container) return;

      if (window._bannerScrollInterval) {
        clearInterval(window._bannerScrollInterval);
        window._bannerScrollInterval = null;
      }

      const slides = container.querySelectorAll('.banner-slide');
      const count = slides.length;
      if (count <= 1) {
        if (dotsContainer) dotsContainer.innerHTML = '';
        return;
      }

      if (dotsContainer) {
        dotsContainer.innerHTML = Array.from({ length: count })
          .map((_, i) => `<span class="banner-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></span>`)
          .join('');

        dotsContainer.querySelectorAll('.banner-dot').forEach(dot => {
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(dot.dataset.index, 10);
            scrollToSlide(idx);
          });
        });
      }

      let currentIndex = 0;
      let isInteracting = false;
      let resumeTimer = null;

      function updateDots(idx) {
        if (!dotsContainer) return;
        const dots = dotsContainer.querySelectorAll('.banner-dot');
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      }

      function scrollToSlide(idx) {
        if (!container || slides.length === 0) return;
        currentIndex = (idx + count) % count;
        const targetSlide = slides[currentIndex];
        if (targetSlide) {
          container.scrollTo({
            left: targetSlide.offsetLeft,
            behavior: 'smooth'
          });
          updateDots(currentIndex);
        }
      }

      function nextSlide() {
        if (isInteracting) return;
        const next = (currentIndex + 1) % count;
        scrollToSlide(next);
      }

      function startTimer() {
        stopTimer();
        window._bannerScrollInterval = setInterval(nextSlide, 4200);
      }

      function stopTimer() {
        if (window._bannerScrollInterval) {
          clearInterval(window._bannerScrollInterval);
          window._bannerScrollInterval = null;
        }
      }

      let scrollTimeout;
      container.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
          const scrollPos = container.scrollLeft;
          const w = container.clientWidth || 1;
          const newIdx = Math.round(scrollPos / w);
          if (newIdx >= 0 && newIdx < count && newIdx !== currentIndex) {
            currentIndex = newIdx;
            updateDots(currentIndex);
          }
        }, 50);
      }, { passive: true });

      const onStart = () => {
        isInteracting = true;
        clearTimeout(resumeTimer);
        stopTimer();
      };
      const onEnd = () => {
        clearTimeout(resumeTimer);
        resumeTimer = setTimeout(() => {
          isInteracting = false;
          startTimer();
        }, 2500);
      };

      container.addEventListener('touchstart', onStart, { passive: true });
      container.addEventListener('touchend', onEnd, { passive: true });
      container.addEventListener('mouseenter', onStart);
      container.addEventListener('mouseleave', onEnd);

      startTimer();
    }

function attachHomeHandlers() {
      document.querySelector('[data-story="onboarding"]')?.addEventListener('click', () => {
        if (window.iceLogixOnboarding) window.iceLogixOnboarding.open();
      });
      document.querySelector('[data-story="reports"]')?.addEventListener('click', () => switchTab('reports'));
      document.querySelector('[data-story="reviews"]')?.addEventListener('click', () => switchTab('reviews'));
      document.querySelector('[data-story="promo"]')?.addEventListener('click', () => switchTab('promo'));
      document.querySelector('[data-story="legitcheck"]')?.addEventListener('click', () => {
        if (!window.userId) { window.requireAuth('Для проверки подлинности необходимо войти или зарегистрироваться.'); return; }
        switchTab('legitcheck');
      });
      document.querySelector('[data-story="academy"]')?.addEventListener('click', () => {
        if (!window.userId) { window.requireAuth('Для доступа к академии необходимо войти или зарегистрироваться.'); return; }
        switchTab('academy');
      });
      document.getElementById('moreMarketplacesBtn')?.addEventListener('click', () => {
        switchTab('catalogs', 'marketplaces');
      });
      document.getElementById('moreProductsBtn')?.addEventListener('click', () => {
        switchTab('catalogs', 'productsCatalog');
      });
      document.querySelectorAll('.marketplace-story').forEach(el => {
        el.addEventListener('click', () => {
          const url = el.getAttribute('data-url');
          if (url) tgUtil.openLink(url);
          else tgUtil.alert('Ссылка на площадку будет добавлена позже');
        });
      });
      document.querySelectorAll('.social-icon').forEach(el => {
        el.addEventListener('click', () => tgUtil.alert('Соцсети будут подключены позже'));
      });

      // Initialize auto-scroll for banners (WB style)
      initBannerAutoScroll();

      document.querySelectorAll('.banner-slide').forEach(el => {
        el.addEventListener('click', () => {
          const promoId = el.dataset.promotionId;
          const action = el.dataset.promoAction;
          if (promoId) {
            window.activePromotionId = promoId;
            tgUtil.alert('Акция применена! Перейдите в калькулятор.');
          } else if (action === 'catalog') {
            switchTab('catalogs');
          } else if (action === 'legit') {
            switchTab('legitcheck');
          } else if (action === 'calculator') {
            switchTab('calculator');
          }
        });
      });

      loadHomeProducts('popular');
      document.getElementById('tabPopular')?.addEventListener('click', () => {
        document.getElementById('tabPopular').classList.add('active');
        document.getElementById('tabForYou').classList.remove('active');
        loadHomeProducts('popular');
      });
      document.getElementById('tabForYou')?.addEventListener('click', () => {
        document.getElementById('tabForYou').classList.add('active');
        document.getElementById('tabPopular').classList.remove('active');
        loadHomeProducts('for_you');
      });

      document.querySelectorAll('.addToCartBtn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          if (!window.userId) { window.requireAuth('Для добавления в корзину необходимо войти или зарегистрироваться.'); return; }
          const productId = btn.dataset.productId;
          if (productId) addToCart(productId);
        };
      });

      document.querySelectorAll('.buyNowBtn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          if (!window.userId) { window.requireAuth('Для оформления заказа необходимо войти или зарегистрироваться.'); return; }
          const url = btn.dataset.url;
          const price = parseFloat(btn.dataset.price);
          if (url && !isNaN(price)) {
            window.tempOrder = {
              url: url,
              price: price,
              weight: 1,
              total: window.iceLogixPricing.quickEstimate(price, 1),
              discountAmount: 0,
              appliedPromo: null
            };
            switchTab('neworder');
          }
        };
      });
    }

    async function loadHomeProducts(tab = 'popular') {
  const grid = document.getElementById('homeProductsGrid');
  if (!grid) return;
  try {
    let data = [];
    if (tab === 'for_you') {
      if (!userId) {
        grid.innerHTML = '<p class="text-white/50 text-sm col-span-2 text-center py-4">Войдите, чтобы получить персональные рекомендации</p>';
        return;
      }
      const { data: views } = await supabaseClient.from('user_views').select('product_id').eq('user_id', userId).order('viewed_at', { ascending: false }).limit(20);
      if (views && views.length > 0) {
        const ids = views.map(v => v.product_id);
        const { data: viewed } = await supabaseClient.from('products').select('*').in('id', ids).eq('is_active', true);
        if (viewed) data = preprocessProducts(viewed);
      }
      if (data.length === 0) {
        grid.innerHTML = '<p class="text-white/50 text-sm col-span-2 text-center py-4">Просматривайте товары, чтобы получить рекомендации</p>';
        return;
      }
    } else {
      const popular = await window.CacheDB.get('popularProducts', async () => {
        // Prefer products marked show_on_home; fall back to any active products
        const { data: homeProds } = await supabaseClient.from('products').select('*').eq('is_active', true).eq('show_on_home', true).limit(10);
        if (homeProds && homeProds.length > 0) return homeProds;
        const { data } = await supabaseClient.from('products').select('*').eq('is_active', true).limit(10);
        return data;
      }, 300000);
      if (popular) data = preprocessProducts(popular);
    }

    const existingCards = Array.from(grid.querySelectorAll('.product-card'));
    const existingIds = existingCards.map(c => c.dataset.productId).join(',');
    const newIds = data.map(p => p.id).join(',');

    if (existingCards.length === 0 || existingIds !== newIds) {
      grid.innerHTML = data.map(p => `
        <div class="product-card" data-product-id="${p.id}">
          <div class="relative">
            ${renderCardMedia(p.image_url, p.title)}
            <span class="absolute top-2 right-2 wishlist-heart text-lg ${wishlist.has(p.id) ? 'text-red-500' : 'text-white/60'} z-20" data-product-id="${p.id}">${getHeartIcon(wishlist.has(p.id))}</span>
          </div>
          <div style="padding: 8px 8px 10px 8px; display: flex; flex-direction: column; flex: 1;">
            <p class="text-white font-bold text-sm truncate" style="font-size: 14px; font-weight: 700; line-height: 1.2;">${p.title}</p>
            <p class="text-cyan-400 font-bold text-xs mt-1" style="font-size: 13px;">${p.price} ${p.currency}</p>
            <div class="flex gap-1.5 mt-2">
              <button class="btn-primary addToCartBtn flex-1 py-1.5 px-2 text-[11px] font-semibold rounded-lg" data-product-id="${p.id}">Корзина</button>
              <button class="buyNowBtn flex-1 py-1.5 px-2 text-[11px] font-semibold rounded-lg" data-url="${p.url}" data-price="${p.price}">Заказать</button>
            </div>
          </div>
        </div>
      `).join('');
      initCardSliders();
    }

    const _cd = document.getElementById('content');
    if (_cd && currentTab === 'home' && !currentSubScreen) {
      _tabCache['home:'] = { html: _cd.innerHTML, ts: Date.now() };
      try { localStorage.setItem('ice_tab_home_v2', _cd.innerHTML); } catch(e){}
    }

    grid.querySelectorAll('.addToCartBtn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const productId = btn.dataset.productId;
        if (productId) addToCart(productId);
      };
    });

    grid.querySelectorAll('.buyNowBtn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        if (!window.userId) { window.requireAuth('Для оформления заказа необходимо войти или зарегистрироваться.'); return; }
        const url = btn.dataset.url;
        const price = parseFloat(btn.dataset.price);
        if (url && !isNaN(price)) {
          window.tempOrder = { url, price, weight: 1, total: window.iceLogixPricing.quickEstimate(price, 1), discountAmount: 0, appliedPromo: null };
          switchTab('neworder');
        }
      };
    });

    grid.querySelectorAll('.product-card').forEach(card => {
      card.onclick = (e) => {
        if (e.target.closest('.wishlist-heart') || e.target.closest('.addToCartBtn') || e.target.closest('.cart-stepper') || e.target.closest('.buyNowBtn') || e.target.closest('.card-photo-container')) return;
        const productId = card.dataset.productId;
        const url = card.querySelector('.buyNowBtn')?.dataset.url;
        const price = parseFloat(card.querySelector('.buyNowBtn')?.dataset.price);
        if (userId && productId) {
          supabaseClient.from('user_views').upsert({ user_id: userId, product_id: productId }, { onConflict: 'user_id,product_id' }).then(() => {});
        }
        if (url && !isNaN(price)) {
          if (!window.userId) { window.requireAuth('Для оформления заказа необходимо войти или зарегистрироваться.'); return; }
          window.tempOrder = { url, price, weight: 1, total: window.iceLogixPricing.quickEstimate(price, 1), discountAmount: 0, appliedPromo: null };
          switchTab('neworder');
        }
      };
    });
    
    // Инициализируем обработчики прокрутки фото для карточек товаров
    initCardSliders();
  } catch(e) {
    console.error('Ошибка загрузки товаров на главной:', e);
  }
}

      const hintVal = (document.getElementById('aiPhotoHint')?.value || '').trim();

      // Оба поля обязательны
      if (files.length === 0) {
        tgUtil.alert('Пожалуйста, загрузите фото товара!');
        return;
      }
      if (!hintVal) {
        tgUtil.alert('Пожалуйста, введите описание товара (бренд, модель, цвет)!');
        return;
      }

      // Платформы по выбранному региону
      const region = window._aiSearchRegion || 'all';
      const platforms = region === 'all' ? undefined : _regionPlatforms[region] || undefined;

      const origBtnText = btn.innerHTML;
      btn.innerHTML = '<span class="animate-spin inline-block mr-1">⌛</span> ИИ и парсер ищут товар…';
      btn.disabled = true;

      resultBox.classList.remove('hidden');
      resultBox.innerHTML = `
        <div class="glass-card p-4 rounded-2xl border border-cyan-500/30 text-center space-y-2 bg-cyan-950/20">
          <div class="text-2xl animate-bounce">🔍</div>
          <p class="text-cyan-300 font-bold text-xs">ИИ анализирует фото и ищет товар на площадках...</p>
          <p class="text-white/40 text-[10px]">Это может занять до 60 секунд</p>
        </div>
      `;

      try {
        let searchData = null;

        // 1. Upload all photos to Storage
        const files = window._aiSearchFiles || (window._aiSearchFile ? [window._aiSearchFile] : []);
        if (files.length === 0) { throw new Error('Нет фото для поиска'); }

        let sessionId = localStorage.getItem('icelogix_session_id');
        if (!sessionId) {
          sessionId = crypto.randomUUID();
          localStorage.setItem('icelogix_session_id', sessionId);
        }

        const screenshotPaths = [];
        for (const f of files) {
          const safeName = f.name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 50);
          const spath = `${sessionId}/${Date.now()}_calc_${safeName}`;
          const { error: upErr } = await supabaseClient.storage
            .from('product-screenshots')
            .upload(spath, f, { contentType: f.type, upsert: false });
          if (upErr) throw new Error('Ошибка загрузки фото: ' + upErr.message);
          screenshotPaths.push(spath);
        }

        const authVal = (document.getElementById('aiAuthTier')?.value || 'all');
        const condVal = (document.getElementById('aiItemCondition')?.value || 'all');
        const maxPriceVal = parseFloat(document.getElementById('aiMaxPrice')?.value) || null;

        // 2. Вызываем search-by-image через XHR (SDK invoke ломается на iOS Safari)
        const payload = JSON.stringify({
          screenshotPath: screenshotPaths[0],
          screenshotPaths: screenshotPaths,
          descriptionHint: hintVal,
          authenticity: authVal,
          condition: condVal,
          maxPrice: maxPriceVal,
          platforms
        });

        // Берём auth token из текущей сессии (если есть)
        let authToken = SUPABASE_ANON_KEY;
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session?.access_token) authToken = session.access_token;
        } catch (_) { /* fallback to anon key */ }

        searchData = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', 'https://vrvwdagjpttvfvjanbwq.supabase.co/functions/v1/search-by-image');
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.setRequestHeader('Authorization', 'Bearer ' + authToken);
          xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
          xhr.timeout = 120000;
          xhr.onload = () => {
            try {
              const json = JSON.parse(xhr.responseText);
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve(json);
              } else {
                reject(new Error(json.error || `Сервер вернул ${xhr.status}`));
              }
            } catch (_) {
              reject(new Error(`Сервер вернул ${xhr.status}: ${xhr.responseText.substring(0, 200)}`));
            }
          };
          xhr.onerror = () => reject(new Error('Сетевая ошибка. Проверьте подключение к интернету.'));
          xhr.ontimeout = () => reject(new Error('Поиск занял слишком много времени (>2 мин). Попробуйте ещё раз.'));
          xhr.send(payload);
        });

        if (!searchData?.ok) {
          throw new Error(searchData?.error || 'Не удалось найти товар');
        }

        // API возвращает results, не items
        const results = Array.isArray(searchData.results) ? searchData.results : [];
        const filtered = results.filter(r => r.url && r.title);

        if (filtered.length === 0) {
          tgUtil.haptic('warning');
          resultBox.innerHTML = `
            <div class="bg-orange-500/20 border border-orange-400/30 rounded-xl p-4 text-center space-y-2">
              <div class="text-2xl">📸</div>
              <p class="text-white/90 text-xs font-bold">Не удалось найти точное совпадение</p>
              <p class="text-white/50 text-[10px]">Пожалуйста, загрузите более чёткое фото товара при хорошем освещении или измените описание и фильтры.</p>
            </div>
          `;
          return;
        }

        // Сохраняем для использования в кнопках
        window._aiSearchResults = filtered;
        window._aiSearchScreenshotPath = screenshotPaths[0] || null;

        tgUtil.haptic('success');

        // Строим карточки
        const _esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        const cards = filtered.map((r, i) => {
          const priceNum = (typeof r.price === 'number' && isFinite(r.price)) ? r.price : null;
          const currency = typeof r.currency === 'string' ? _esc(r.currency) : '';
          const priceLine = (priceNum && currency)
            ? `<span class="text-cyan-400 font-extrabold text-sm">${priceNum} ${currency}</span>`
            : '<span class="text-white/40 text-xs">Цена не определена</span>';
          const imgUrl = r.image_url || null;
          const img = imgUrl
            ? `<img src="${_esc(imgUrl)}" class="w-16 h-16 object-cover rounded-xl flex-shrink-0 border border-white/10" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
            : '<div class="w-16 h-16 bg-white/10 rounded-xl flex-shrink-0 flex items-center justify-center text-2xl border border-white/10">🛍️</div>';
          const title = _esc(r.title || '(без названия)');
          const platformLabel = _esc(r.platform_label || r.platform || '');
          const flag = _esc(r.flag || '');
          const safeUrl = r.url || '';

          return `
            <div class="bg-white/5 border border-white/10 rounded-xl p-3 flex gap-3 hover:border-cyan-500/30 transition">
              ${img}
              <div class="flex-1 min-w-0">
                <div class="text-[10px] text-white/50 mb-0.5">${flag} ${platformLabel}</div>
                <div class="text-xs font-bold text-white leading-snug line-clamp-2" title="${title}">${title}</div>
                <div class="mt-1">${priceLine}</div>
                <div class="flex gap-2 mt-2">
                  <button type="button" data-calc-pick="${i}" class="flex-1 py-2 rounded-lg text-[10px] font-bold text-white bg-cyan-500/20 border border-cyan-500/30 hover:bg-cyan-500/30 active:scale-95 transition cursor-pointer">✓ Выбрать</button>
                  ${safeUrl ? `<button type="button" data-calc-goto="${i}" class="py-2 px-3 rounded-lg text-[10px] font-bold text-cyan-300 bg-white/5 border border-white/10 hover:bg-white/10 active:scale-95 transition cursor-pointer">↗ Перейти</button>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');

        const queryText = searchData.query || searchData.enhanced_query || searchData.vision_query || hintVal;
        const platformsCount = Array.isArray(searchData.platforms) ? searchData.platforms.length : 0;
        const replicaBanner = searchData.authenticity_tier === 'replica' 
          ? `<div class="bg-orange-500/20 border border-orange-500/40 text-orange-400 p-2 rounded-lg text-[10px] font-bold mb-2 flex items-center gap-1">⚠️ Найдены реплики</div>` 
          : '';

        resultBox.innerHTML = `
          <div class="glass-card p-4 border border-cyan-500/30 rounded-2xl bg-cyan-950/30 space-y-3 shadow-xl">
            <div class="flex items-center justify-between text-xs font-bold text-cyan-300 border-b border-white/10 pb-2">
              <span>✨ Найдено ${filtered.length} товаров</span>
              ${platformsCount ? `<span class="text-white/40 text-[10px] font-normal">на ${platformsCount} площадках</span>` : ''}
            </div>
            ${queryText ? `<div class="text-[10px] text-white/50">Запрос: <span class="text-cyan-300">"${_esc(queryText)}"</span></div>` : ''}
            ${replicaBanner}
            <div class="flex flex-col gap-2 max-h-[50vh] overflow-y-auto pr-1">${cards}</div>
            <div class="pt-2 border-t border-white/10">
              <button type="button" onclick="window.cancelAiSearchResult()" class="w-full py-2 rounded-xl text-xs font-semibold text-white/50 hover:text-white/80 active:scale-95 transition cursor-pointer bg-transparent border-0">
                ❌ Отменить
              </button>
            </div>
          </div>
        `;

        // Навешиваем обработчики на карточки
        resultBox.querySelectorAll('[data-calc-pick]').forEach(pickBtn => {
          pickBtn.addEventListener('click', () => {
            const idx = parseInt(pickBtn.dataset.calcPick, 10);
            const picked = filtered[idx];
            if (!picked) return;
            tgUtil.haptic('light');
            window._showPickOptions(picked, idx);
          });
        });
        resultBox.querySelectorAll('[data-calc-goto]').forEach(gotoBtn => {
          gotoBtn.addEventListener('click', () => {
            const idx = parseInt(gotoBtn.dataset.calcGoto, 10);
            const picked = filtered[idx];
            if (!picked?.url) return;
            tgUtil.openLink(picked.url);
          });
        });

      } catch (err) {
        tgUtil.haptic('warning');
        resultBox.innerHTML = `
          <div class="bg-red-500/20 border border-red-400/30 rounded-xl p-3 text-xs text-white/90">
            ⚠️ Ошибка поиска: ${err.message || 'Не удалось найти товар'}
          </div>
        `;
      } finally {
        btn.innerHTML = origBtnText;
        btn.disabled = false;
      }
    };

    // Показать опции для выбранного товара (Заполнить ИИ / Ввести вручную)
    window._showPickOptions = (item, idx) => {
      const overlay = document.createElement('div');

          <div class="flex gap-3 items-center pb-3 border-b border-white/10">
            ${item.image_url ? `<img src="${item.image_url}" class="w-14 h-14 rounded-xl object-cover border border-white/10">` : '<div class="w-14 h-14 rounded-xl bg-white/10 flex items-center justify-center text-xl">🛍️</div>'}
            <div class="flex-1 min-w-0">
              <div class="text-xs font-bold text-white truncate">${item.title || 'Товар'}</div>
              <div class="text-xs text-cyan-300 font-bold mt-0.5">${item.price ? item.price + ' ' + (item.currency || '') : 'Цена не определена'}</div>
              <div class="text-[10px] text-white/40">${item.flag || ''} ${item.platform_label || item.platform || ''}</div>
            </div>
          </div>
          <button type="button" id="pickAutoFill" class="btn-primary w-full py-3.5 rounded-xl font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-cyan-500/20 active:scale-95 transition cursor-pointer border-0">
            ✨ Заполнить данные автоматически (ИИ)
          </button>
          <button type="button" id="pickManual" class="w-full py-3 rounded-xl font-bold text-xs text-cyan-300 bg-white/5 hover:bg-white/10 border border-white/10 active:scale-95 transition cursor-pointer">
            ✏️ Ввести данные самостоятельно
          </button>
          <button type="button" id="pickCancel" class="w-full py-2 rounded-xl text-xs font-semibold text-white/50 hover:text-white/80 active:scale-95 transition cursor-pointer bg-transparent border-0">
            ← Назад к результатам
          </button>
        </div>
      `;
      document.body.appendChild(overlay);

      const close = () => overlay.remove();

      overlay.querySelector('#pickAutoFill').onclick = async () => {
        close();
        // Оцениваем вес для выбранного товара
        let estWeight = 1.0;
        try {
          const calcWeightRes = await supabaseClient.functions.invoke('ai-calculator', {
            body: {
              action: 'estimate_weight',
              description: item.title || '',
              screenshotPath: window._aiSearchScreenshotPath || null
            }
          });
          if (calcWeightRes.data?.ok) {
            estWeight = parseFloat(calcWeightRes.data.estimated_weight || calcWeightRes.data.weight) || 1.0;
          }
        } catch(e) {
          console.warn('Weight estimation fallback:', e);
        }

        window._pendingAiData = {
          title: item.title || 'Товар',
          price: item.price || 0,
          currency: item.currency || 'CNY',
          weight: estWeight,
          link: item.url || '',
          image: item.image_url || null,
          country: item.country || 'CN'
        };
        window._calcMode = 'manual';
        window.renderCurrentScreen();
      };

      overlay.querySelector('#pickManual').onclick = () => {
        close();
        if (item.url) {
          navigator.clipboard.writeText(item.url).catch(() => {});
          glassToast('Ссылка скопирована! Заполните данные вручную', { kind: 'info' });
        }
        window._calcMode = 'manual';
        window.renderCurrentScreen();
      };

      overlay.querySelector('#pickCancel').onclick = close;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    };

    window.applyAiSearchResult = (autoFill) => {
      tgUtil.haptic('light');
      if (autoFill && window._currentAiFoundItem) {
        window._pendingAiData = window._currentAiFoundItem;
      } else if (!autoFill && window._currentAiFoundItem?.link) {
        navigator.clipboard.writeText(window._currentAiFoundItem.link);
        glassToast('Ссылка скопирована! Заполните данные вручную', { kind: 'info' });
      }
      window._calcMode = 'manual';
      window.renderCurrentScreen();
    };

    window.cancelAiSearchResult = () => {
      tgUtil.haptic('light');
      window._currentAiFoundItem = null;
      // Revoke all blob URLs
      if (window._aiSearchBlobUrls) {
        window._aiSearchBlobUrls.forEach(u => URL.revokeObjectURL(u));
      }
      window._aiSearchFiles = [];
      window._aiSearchBlobUrls = [];
      window._aiSearchFile = null;
      window._aiSearchResults = null;
      window._calcMode = 'menu';
      window.renderCurrentScreen();
    };

    window.handleAiSearchPhotoSelect = (input) => {
      const newFiles = Array.from(input.files || []);
      if (!newFiles.length) return;

      if (!window._aiSearchFiles) window._aiSearchFiles = [];
      if (!window._aiSearchBlobUrls) window._aiSearchBlobUrls = [];

      for (const file of newFiles) {
        if (!file.type.startsWith('image/')) { tgUtil.alert('Только изображения!'); continue; }
        if (file.size > 10 * 1024 * 1024) { tgUtil.alert('Файл ' + file.name + ' больше 10 МБ!'); continue; }
        if (window._aiSearchFiles.length >= 5) { tgUtil.alert('Максимум 5 фото!'); break; }
        window._aiSearchFiles.push(file);
        window._aiSearchBlobUrls.push(URL.createObjectURL(file));
      }

      // Re-render to show previews
      window.renderCurrentScreen();

      // After render, set img srcs from blob URLs
      requestAnimationFrame(() => {
        const thumbs = document.querySelectorAll('.ai-photo-thumb');
        thumbs.forEach((img) => {
          const idx = parseInt(img.dataset.idx, 10);
          if (window._aiSearchBlobUrls && window._aiSearchBlobUrls[idx]) {
            img.src = window._aiSearchBlobUrls[idx];
          }
        });
      });
    };

    window.removeAiSearchPhoto = (idx) => {
      if (!window._aiSearchFiles || !window._aiSearchBlobUrls) return;
      // Revoke the blob URL to free memory
      if (window._aiSearchBlobUrls[idx]) {
        URL.revokeObjectURL(window._aiSearchBlobUrls[idx]);
      }
      window._aiSearchFiles.splice(idx, 1);
      window._aiSearchBlobUrls.splice(idx, 1);
      window.renderCurrentScreen();
      // Re-set blob URLs after render
      requestAnimationFrame(() => {
        const thumbs = document.querySelectorAll('.ai-photo-thumb');
        thumbs.forEach((img) => {
          const i = parseInt(img.dataset.idx, 10);
          if (window._aiSearchBlobUrls && window._aiSearchBlobUrls[i]) {
            img.src = window._aiSearchBlobUrls[i];
          }
        });
      });
    };

    window.clearAiSearchPhoto = () => {
      // Revoke all blob URLs
      if (window._aiSearchBlobUrls) {
        window._aiSearchBlobUrls.forEach(u => URL.revokeObjectURL(u));
      }
      window._aiSearchFiles = [];
      window._aiSearchBlobUrls = [];
      window._aiSearchFile = null; // backward compat
      window.renderCurrentScreen();
    };
    // ==================== GLOBAL CALCULATOR HELPERS ====================
    window.selectCalculatorCountry = (c) => {
      if (c === 'CN') {
        window.calcCountry = 'CN';
        tgUtil.haptic('success');
        renderCurrentScreen();
        
        // Lock currency selection when CN is selected
        setTimeout(() => {
          const currencySelect = document.getElementById('calcCurrency');
          if (currencySelect) {
            currencySelect.value = 'CNY';
            currencySelect.disabled = true;
            currencySelect.classList.add('cursor-not-allowed', 'opacity-60');
          }
        }, 50);
      } else {
        tgUtil.haptic('warning');
        const cObj = ALL_COUNTRIES.find(x => x.code === c);
        const name = cObj ? cObj.name : c;
        glassToast(`Направление (${name}) временно недоступно. Скоро мы запустим доставку из этой страны!`, { kind: 'info' });
      }
    };

    window.selectImportedCalculation = (serializedData) => {
      try {
        const c = JSON.parse(decodeURIComponent(serializedData));
        tgUtil.haptic('success');
        
        window.orderAddSubMode = 'manual';
        window.orderLinkAnalyzed = true;
        
        renderCurrentScreen();
        
        setTimeout(() => {
          if (document.getElementById('orderUrlManual')) {
            document.getElementById('orderUrlManual').value = c.url || '';
          }
          if (document.getElementById('orderBrand')) {
            document.getElementById('orderBrand').value = c.brand || '';
          }
          if (document.getElementById('orderModel')) {
            document.getElementById('orderModel').value = c.model || c.title || '';
          }
          if (document.getElementById('orderFeatures')) {
            document.getElementById('orderFeatures').value = c.color || '';
          }
          if (document.getElementById('orderColor')) {
            document.getElementById('orderColor').value = c.color || '';
          }
          if (document.getElementById('orderSize')) {
            document.getElementById('orderSize').value = c.size || '';
          }
          if (document.getElementById('orderWeight')) {
            document.getElementById('orderWeight').value = c.weight || 1.0;
            const weightVal = document.getElementById('orderWeightVal');
            if (weightVal) weightVal.textContent = (c.weight || 1.0) + ' кг';
          }
          if (document.getElementById('orderPrice')) {

            document.getElementById('orderPrice').dispatchEvent(new Event('input', { bubbles: true }));

          if (document.getElementById('orderCurrency')) {

        console.error(e);
        glassToast('Ошибка импорта расчета', { kind: 'error' });
      }
    };

    // ==================== CATEGORY PICKER SHEET ====================
    window.openCategoryPickerSheet = (prefix = 'calc') => {
      window._activeCategoryPickerPrefix = prefix;
      const gender = document.getElementById(`${prefix}Gender`)?.value || 'Унисекс';

            <div class="gx-sheet-title">Выбор категории товара</div>
            <button class="gx-sheet-close" aria-label="Закрыть">${ix('x', { size: '18px' })}</button>

            <!-- Dynamic step rendering -->
          </div>
        </div>
      `;
      
      const list = overlay.querySelector('.gx-sheet-list');
      const currentVal = document.getElementById(`${prefix}Category`)?.value || '';
      
      window.renderStep1 = () => {
        list.innerHTML = `
          <div class="p-4 flex flex-col gap-3">
            <button type="button" class="gx-sheet-opt font-bold flex items-center gap-3 p-4 bg-white/5 border border-white/10 rounded-2xl w-full text-left cursor-pointer transition active:scale-95" onclick="window.selectBroadGroup('Обувь')">
              <span class="text-2xl">👟</span>
              <div class="flex-1">
                <div class="text-white text-sm">Обувь</div>
                <div class="text-white/40 text-xs font-normal mt-0.5">Кроссовки, кеды, туфли, ботинки</div>

              <span class="text-white/30 text-sm">➔</span>
            </button>
            <button type="button" class="gx-sheet-opt font-bold flex items-center gap-3 p-4 bg-white/5 border border-white/10 rounded-2xl w-full text-left cursor-pointer transition active:scale-95" onclick="window.selectBroadGroup('Одежда')">
              <span class="text-2xl">👕</span>
              <div class="flex-1">
                <div class="text-white text-sm">Одежда</div>
                <div class="text-white/40 text-xs font-normal mt-0.5">Худи, футболки, джинсы, куртки</div>

              <span class="text-white/30 text-sm">➔</span>

      function saveCalculationToHistory(order) {
        const key = 'ice_calc_history';
        let history = [];
        try {
          history = JSON.parse(localStorage.getItem(key) || '[]');
        } catch (e) {}
        
        history = history.filter(item => !(item.title === order.title && item.price === order.price));
        
        history.unshift({
          ...order,
          timestamp: Date.now(),
          id: 'calc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9)
        });
        
        const fourteenDays = 14 * 24 * 60 * 60 * 1000;
        history = history.filter(item => Date.now() - item.timestamp < fourteenDays);
        if (history.length > 50) history = history.slice(0, 50);
        
        localStorage.setItem(key, JSON.stringify(history));

window.getFortuneSpinCooldown = () => {
  const lastSpin = localStorage.getItem('last_fortune_spin');
  if (!lastSpin) return 0;
  const elapsed = Date.now() - parseInt(lastSpin);
  const cooldown = 24 * 60 * 60 * 1000;
  return Math.max(0, cooldown - elapsed);
};

const ICE_ENCRYPT_KEY = 'ICE_LOGIX_2026_SEC_v1';

function encryptData(obj) {
  return CryptoJS.AES.encrypt(JSON.stringify(obj), ICE_ENCRYPT_KEY).toString();
}
function decryptData(cipher) {
  try {
    const bytes = CryptoJS.AES.decrypt(cipher, ICE_ENCRYPT_KEY);
    return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
  } catch { return null; }
}
function maskPhone(phone) {
  if (!phone || phone.length < 8) return phone || '';
  return phone.slice(0, 4) + ' ** *** ' + phone.slice(-4);
}
function maskCard(cardNumber) {
  const n = (cardNumber || '').replace(/\s/g, '');
  if (n.length < 4) return '****';
  return '**** **** **** ' + n.slice(-4);
}
function applyTheme(theme) {
  if (theme === window._currentAppliedTheme) return;
  window._currentAppliedTheme = theme;
  document.documentElement.classList.add('no-transitions');
  if (theme === 'light') {
    document.documentElement.classList.add('light-theme');
  } else {
    document.documentElement.classList.remove('light-theme');
  }
  // Force layout reflow only when theme actually changed
  void document.documentElement.offsetHeight;
  setTimeout(() => {
    document.documentElement.classList.remove('no-transitions');
  }, 50);
}

      { id: 'shoes', label: '👟 Обувь' },

    const categoryTabsHtml = categories.map(c => `
      <button class="flex-1 py-2 text-center text-xs font-bold rounded-xl border transition ${activeCategory === c.id ? 'bg-cyan-500/20 border-cyan-500 text-cyan-400' : 'border-white/10 hover:bg-white/5 text-white/70'}" onclick="window.setSizeTableCategory('${c.id}')">
        ${c.label}
      </button>
    `).join('');
    
    const brandTabsHtml = brands.map(b => `
      <button class="px-3 py-1.5 text-center text-[11px] font-bold rounded-lg border transition whitespace-nowrap ${activeBrand === b ? 'bg-white/10 border-white/20 text-white' : 'border-transparent text-white/50 hover:text-white'}" onclick="window.setSizeTableBrand('${b}')">
        ${b}
      </button>
    `).join('');
    
    let tableHtml = '';
    
    if (activeCategory === 'shoes') {
      const data = getShoesData(activeBrand);
      const isChina = activeBrand === 'Pinduoduo';
      const col1 = isChina ? 'Площадка' : 'Размер';
      const col2 = isChina ? 'EU аналог' : 'US аналог';
      const col3 = isChina ? 'Длина стопы' : 'UK аналог';
      const col4 = isChina ? 'Посадка' : 'Стелька';
      
      tableHtml = `
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-white/10 text-white/60">
              <th class="py-2 font-semibold">${col1}</th>
              <th class="py-2 font-semibold">${col2}</th>
              <th class="py-2 font-semibold">${col3}</th>
              <th class="py-2 font-semibold">${col4}</th>
              <th class="py-2 text-right">Выбрать</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-white/5 text-white/80">
            ${data.map(row => {
              const applyVal = row.eu.split(' ')[0];
              return `
                <tr class="hover:bg-white/5 transition-colors">
                  <td class="py-2.5 font-mono font-bold text-cyan-400">${row.eu}</td>
                  <td class="py-2.5 font-mono">${row.us}</td>
                  <td class="py-2.5 font-mono">${row.uk}</td>
                  <td class="py-2.5 font-mono text-white/70">${row.cm}</td>
                  <td class="py-2.5 text-right">
                    <button class="bg-cyan-500 hover:bg-cyan-600 text-slate-900 font-bold px-2.5 py-1 rounded text-[10px] transition" onclick="window.applySelectedSize('${applyVal}')">Выбрать</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    } else {
      const data = getClothingData(activeBrand);
      const isChina = activeBrand === 'Pinduoduo';
      const col1 = 'Размер';
      const col2 = 'Рост (см)';
      const col3 = isChina ? 'Вес (кг)' : 'Обхват груди';
      const col4 = isChina ? 'Рекомендация' : 'Обхват талии';
      
      tableHtml = `
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-white/10 text-white/60">
              <th class="py-2 font-semibold">${col1}</th>
              <th class="py-2 font-semibold">${col2}</th>
              <th class="py-2 font-semibold">${col3}</th>
              <th class="py-2 font-semibold">${col4}</th>
              <th class="py-2 text-right">Выбрать</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-white/5 text-white/80">
            ${data.map(row => {
              const applyVal = row.size.split(' ')[0];
              return `
                <tr class="hover:bg-white/5 transition-colors">
                  <td class="py-2.5 font-bold text-cyan-400">${row.size}</td>
                  <td class="py-2.5 font-mono">${row.height}</td>
                  <td class="py-2.5 font-mono">${row.chest}</td>
                  <td class="py-2.5 font-mono text-white/70">${row.weight}</td>
                  <td class="py-2.5 text-right">
                    <button class="bg-cyan-500 hover:bg-cyan-600 text-slate-900 font-bold px-2.5 py-1 rounded text-[10px] transition" onclick="window.applySelectedSize('${applyVal}')">Выбрать</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }
    
    return `
      <div class="bg-slate-900/90 backdrop-blur-2xl border border-white/10 rounded-2xl max-w-md w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden page-enter">
        <div class="p-4 border-b border-white/10 flex justify-between items-center bg-white/5">
          <div>
            <h3 class="text-white font-bold text-base flex items-center gap-1.5">
              ${ix('compare', { cls: 'text-cyan-400' })}
              <span>Справочник размеров</span>
            </h3>
            <p class="text-white/50 text-[10px] mt-0.5">Выберите нужный размер для автоподстановки</p>
          </div>
          <button id="closeSizeTablesBtn" class="text-white/50 hover:text-white transition-colors text-lg">${ix('x')}</button>
        </div>
        
        <div class="p-4 space-y-4 overflow-y-auto flex-1">
          <!-- Category Tabs -->
          <div class="flex gap-2">
            ${categoryTabsHtml}
          </div>
          
          <!-- Brand Tabs (horizontal scrollable list) -->
          <div class="overflow-x-auto flex gap-1.5 pb-2 scrollbar-none border-b border-white/5">
            ${brandTabsHtml}
          </div>
          
          <!-- Table -->
          <div class="bg-white/5 p-3 rounded-xl border border-white/5 max-h-[40vh] overflow-y-auto">
            ${tableHtml}
          </div>
          
          <!-- Footer Tip -->
          <p class="text-white/40 text-[10px] text-center leading-relaxed">
            💡 Размерные сетки указаны на основе официальных стандартов брендов. Для точного соответствия вы также можете заполнить свои физические замеры!
          </p>
        </div>
      </div>
    `;
  };
  
  modal.innerHTML = renderModalContent();
  document.body.appendChild(modal);
  
  window.setSizeTableCategory = (cat) => {
    tgUtil.haptic('light');
    activeCategory = cat;
    // Set default brand based on category compatibility
    if (cat === 'shoes') activeBrand = 'Nike';
    else activeBrand = 'Zara';
    modal.innerHTML = renderModalContent();
  };
  
  window.setSizeTableBrand = (brand) => {
    tgUtil.haptic('light');
    activeBrand = brand;
    modal.innerHTML = renderModalContent();
  };
  
  window.applySelectedSize = (size) => {
    tgUtil.haptic('success');
    const calcSizeEl = document.getElementById('calcSize');
    const orderSizeEl = document.getElementById('orderSize');
    
    if (currentTab === 'calculator' && calcSizeEl) {
      calcSizeEl.value = size;
      const changeEvent = new Event('change', { bubbles: true });
      calcSizeEl.dispatchEvent(changeEvent);
      glassToast(`Размер ${size} применен в калькулятор!`, { kind: 'success' });
    } else if (currentTab === 'neworder' && orderSizeEl) {
      orderSizeEl.value = size;
      glassToast(`Размер ${size} применен в заказ!`, { kind: 'success' });
    } else {
      if (calcSizeEl) calcSizeEl.value = size;
      if (orderSizeEl) orderSizeEl.value = size;
      glassToast(`Размер ${size} выбран!`, { kind: 'success' });
    }
    modal.remove();
  };
  
  // Use robust event delegation for close button
  modal.addEventListener('click', (e) => {
    if (e.target.closest('#closeSizeTablesBtn')) {
      modal.remove();
    }
  });
}

window.switchPackageTab = (country) => {
  tgUtil.haptic('light');
  window.activePackageTab = country;
  renderCurrentScreen();
};

window.togglePackageConsolidation = (country) => {
  tgUtil.haptic('light');
  window.tempOrder.consolidation = window.tempOrder.consolidation || {};
  const checkbox = document.getElementById('pkgConsolidationCheck');
  if (checkbox) {
    window.tempOrder.consolidation[country] = checkbox.checked;
  }
  recalculateOrderTotals();
};

  // ================== ПАГИНАЦИЯ ЗАКАЗОВ ==================
  const prevBtn = document.getElementById('adminOrdersPrev');
  const nextBtn = document.getElementById('adminOrdersNext');
  if (prevBtn) prevBtn.onclick = () => { if (adminOrdersPage > 1) { adminOrdersPage--; renderCurrentScreen(); } };
  if (nextBtn) nextBtn.onclick = () => { if (adminOrdersPage < adminOrdersTotalPages) { adminOrdersPage++; renderCurrentScreen(); } };
    // ================== СМЕНА СТАТУСА ЗАКАЗА (ДЕЛЕГИРОВАНИЕ) ==================
    if (!window._statusChangeHandler) {
    window._statusChangeHandler = async (e) => {
      if (e.target.classList.contains('changeOrderStatus')) {
        const select = e.target;
        const newStatus = select.value;
        if (!newStatus) return;
        const orderId = select.dataset.orderId;
        const userId = select.dataset.userId;
        const previousStatus = select.dataset.previousStatus;
        if (!confirm(`Изменить статус заказа на "${getStatusText(newStatus)}"?`)) {
          select.value = previousStatus || '';
          return;
        }
        try {
          const { error } = await supabaseClient.from('orders').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', orderId);
          if (error) throw error;
          logAdminAction('order_status', { orderId, newStatus, previousStatus });
          const statusMessages = {
            'paid': '✅ Ваш заказ оплачен! Мы приступаем к выкупу.',
            'bought': '🛍️ Товар выкуплен! Ожидайте отправки на склад.',
            'on_sklad_cn': '📦 Товар на складе в Китае. Идёт подготовка к отправке.',
            'in_transit': '🚚 Ваш заказ в пути! Трек-номер появится позже.',
            'in_belarus': '🇧🇾 Товар в Беларуси! Скоро будет доставлен.',
            'delivered': '🎉 Заказ доставлен! Спасибо, что выбрали ICE LOGIX!'
          };
          const message = statusMessages[newStatus];
          if (message) {
            await sendNotification(userId, message, orderId);
          }
          renderCurrentScreen();
        } catch (err) {
          alert('Ошибка: ' + err.message);
          select.value = previousStatus || '';
        }
      }
    };
    document.addEventListener('change', window._statusChangeHandler);
  }
    // [EXTRACTED MODULE] Profile Modals & Settings is loaded from /js/modules/profile-modals.js
    // [EXTRACTED MODULE] Promotions & History is loaded from /js/modules/promos-history.js

    // [EXTRACTED MODULE] Admin Analytics & CRM is loaded from /js/modules/admin-analytics.js
        // ==================== ЗАПУСК ====================
        init();

        // ==================== WATCHDOG: content disappear guard ====================
        // Starts 3s after init to avoid triggering during initial load
        setTimeout(() => {
          let _contentWatchdogTimer = null;
          const _contentDiv = document.getElementById('content');
          if (_contentDiv && typeof MutationObserver !== 'undefined') {
            const _watchdog = new MutationObserver(() => {
              clearTimeout(_contentWatchdogTimer);
              _contentWatchdogTimer = setTimeout(() => {
                if (_contentDiv.innerHTML.trim().length === 0) {
                  console.warn('[ICE LOGIX] Content watchdog triggered — re-rendering');
                  renderCurrentScreen();
                }
              }, 1500);
            });
            _watchdog.observe(_contentDiv, { childList: true, subtree: false });
          }
        }, 3000);
  </script>
