<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Пульт поддержки ICE LOGIX</title>
  <link rel="icon" type="image/png" href="/assets/splash-logo-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/vendor/supabase.min.js"></script>
  <link rel="stylesheet" href="/css/ice-redesign.css?v=20261031_th1">
  <link rel="stylesheet" href="/css/ice-screens.css?v=20261031_co6">
  <link rel="stylesheet" href="/css/support-desk.css?v=20261031_01">
  <script src="/js/modules/ice-ui.js?v=20261102_01"></script>
</head>
<body class="sd-body">
  <!-- Проверка входа / нет доступа -->
  <div id="sdGate" class="sd-gate">
    <div class="sd-gate-spin" aria-label="Загрузка"></div>
  </div>

  <div id="sdApp" class="sd-app" hidden>
    <!-- Список обращений -->
    <section class="sd-pane sd-list-pane" aria-label="Обращения">
      <header class="sd-bar">
        <div class="sd-bar-txt">
          <h1 class="sd-title">Поддержка</h1>
          <p class="sd-sub" id="sdMe"></p>
        </div>
        <button type="button" class="sd-icon-btn" id="sdTemplatesBtn" aria-label="Шаблоны ответов"></button>
        <button type="button" class="sd-icon-btn" id="sdTeamBtn" aria-label="Команда поддержки"></button>
      </header>
      <div class="sd-tools">
        <div class="rd-chips sd-chips" id="sdFilters" role="tablist"></div>
        <label class="rd-field sd-search" id="sdSearchField">
          <input id="sdSearch" type="search" enterkeyhint="search" placeholder="Имя, текст или номер обращения" autocomplete="off">
        </label>
      </div>
      <div class="sd-list" id="sdTickets"></div>
    </section>

    <!-- Диалог -->
    <section class="sd-pane sd-chat-pane" aria-label="Диалог">
      <div class="sd-chat-empty" id="sdChatEmpty"></div>
      <div class="sd-room" id="sdRoom" hidden>
        <header class="sd-bar sd-room-bar">
          <button type="button" class="sd-icon-btn sd-back" id="sdBack" aria-label="К списку обращений"></button>
          <button type="button" class="sd-who" id="sdWho" aria-label="Карточка клиента"></button>
        </header>
        <div class="sd-actions" id="sdActions"></div>
        <div class="sd-msgs" id="sdMsgs" aria-live="polite"></div>
        <div class="sd-composer" id="sdComposer">
          <div class="fn-seg sd-mode" id="sdMode">
            <button type="button" class="on" data-mode="reply">Ответ клиенту</button>
            <button type="button" data-mode="note">Заметка для команды</button>
          </div>
          <div class="sd-attach" id="sdAttach" hidden></div>
          <div class="sd-compose-row">
            <button type="button" class="sd-cbtn" id="sdTplBtn" aria-label="Вставить шаблон"></button>
            <button type="button" class="sd-cbtn" id="sdFileBtn" aria-label="Прикрепить фото или файл"></button>
            <textarea id="sdInput" class="sd-input" rows="1" placeholder="Ответ клиенту"></textarea>
            <button type="button" class="sd-send" id="sdSend" aria-label="Отправить"></button>
          </div>
          <input type="file" id="sdFileInput" hidden>
        </div>
      </div>
    </section>
  </div>

  <script src="/js/modules/support-desk.js?v=20261031_01"></script>
</body>
</html>
